databaseChangeLog:
  - changeSet:
      id: dcl-roles-academic-001
      author: jesus-gonzalez
      labels: "dcl,roles"
      comment: Roles reader/writer/admin del dominio academic
      changes:
        - sqlFile: {path: 001_create_roles.sql, relativeToChangelogFile: true, splitStatements: false, stripComments: false}
      rollback:
        - sql: {sql: "DROP ROLE IF EXISTS academic_reader; DROP ROLE IF EXISTS academic_writer; DROP ROLE IF EXISTS academic_admin;"}
